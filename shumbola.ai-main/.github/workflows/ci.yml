name: CI

on:
  push:
  pull_request:

jobs:
  agent-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agent-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./...
      - run: go test ./... -v

  web-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web-ui/package-lock.json
      - run: npm ci
      - run: npm run build
